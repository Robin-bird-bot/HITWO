<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <style>#sq .legs-b, #sq .legs-a, #sq .eye-shut, #sq .tongue, #sq .sweat { display: none; } /* idle: sitting. Running: show .legs-a and .legs-b in turn, hide .legs-sit. Tired: show .tongue, .sweat, .eye-shut */</style>
  <defs>
    <radialGradient id="wbg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#4a2c17"/><stop offset="1" stop-color="#2a170c"/></radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4824a"/><stop offset="1" stop-color="#a95a2c"/></linearGradient>
    <linearGradient id="tailg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c06a36"/><stop offset="1" stop-color="#8c4520"/></linearGradient>
  </defs>
  <!-- the back of the wheel -->
  <circle cx="120" cy="120" r="104" fill="url(#wbg)"/>
  <g id="wheel">
    <circle cx="120" cy="120" r="104" fill="none" stroke="#8a5a2e" stroke-width="10"/>
    <circle cx="120" cy="120" r="104" fill="none" stroke="#c48a4a" stroke-width="3" stroke-dasharray="2 14"/>
    <circle cx="120" cy="120" r="92" fill="none" stroke="#6e4422" stroke-width="3"/>
    <g stroke="#7a4c26" stroke-width="5" stroke-linecap="round">
      <line x1="120" y1="120" x2="120" y2="30"/><line x1="120" y1="120" x2="198" y2="165"/><line x1="120" y1="120" x2="42" y2="165"/>
    </g>
    <g id="rungs" stroke="#e0b070" stroke-width="3"><line x1="212.0" y1="120.0" x2="223.0" y2="120.0"/><line x1="209.7" y1="140.5" x2="220.4" y2="142.9"/><line x1="202.9" y1="159.9" x2="212.8" y2="164.7"/><line x1="191.9" y1="177.4" x2="200.5" y2="184.2"/><line x1="177.4" y1="191.9" x2="184.2" y2="200.5"/><line x1="159.9" y1="202.9" x2="164.7" y2="212.8"/><line x1="140.5" y1="209.7" x2="142.9" y2="220.4"/><line x1="120.0" y1="212.0" x2="120.0" y2="223.0"/><line x1="99.5" y1="209.7" x2="97.1" y2="220.4"/><line x1="80.1" y1="202.9" x2="75.3" y2="212.8"/><line x1="62.6" y1="191.9" x2="55.8" y2="200.5"/><line x1="48.1" y1="177.4" x2="39.5" y2="184.2"/><line x1="37.1" y1="159.9" x2="27.2" y2="164.7"/><line x1="30.3" y1="140.5" x2="19.6" y2="142.9"/><line x1="28.0" y1="120.0" x2="17.0" y2="120.0"/><line x1="30.3" y1="99.5" x2="19.6" y2="97.1"/><line x1="37.1" y1="80.1" x2="27.2" y2="75.3"/><line x1="48.1" y1="62.6" x2="39.5" y2="55.8"/><line x1="62.6" y1="48.1" x2="55.8" y2="39.5"/><line x1="80.1" y1="37.1" x2="75.3" y2="27.2"/><line x1="99.5" y1="30.3" x2="97.1" y2="19.6"/><line x1="120.0" y1="28.0" x2="120.0" y2="17.0"/><line x1="140.5" y1="30.3" x2="142.9" y2="19.6"/><line x1="159.9" y1="37.1" x2="164.7" y2="27.2"/><line x1="177.4" y1="48.1" x2="184.2" y2="39.5"/><line x1="191.9" y1="62.6" x2="200.5" y2="55.8"/><line x1="202.9" y1="80.1" x2="212.8" y2="75.3"/><line x1="209.7" y1="99.5" x2="220.4" y2="97.1"/></g>
  </g>
  <!-- the hub -->
  <circle cx="120" cy="120" r="13" fill="#e8c55a" stroke="#7a5418" stroke-width="3"/>
  <circle cx="120" cy="120" r="4" fill="#7a5418"/>
  <!-- the squirrel, standing on the bottom of the wheel, facing right -->
  <g id="sq" transform="translate(46 115) scale(1.35)">
    <g class="sq-body">
      <!-- tail -->
      <path class="sq-tail" d="M32 52 C2 54 -12 28 -2 6 C8 -14 38 -14 42 6 C45 20 32 28 24 21 C34 34 44 42 32 52Z" fill="url(#tailg)" stroke="#3b1f10" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M4 14 C10 0 28 -2 34 8" fill="none" stroke="#e8a06a" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <!-- back legs, two frames -->
      <g class="legs-a" stroke="#3b1f10" stroke-width="2.5" stroke-linejoin="round">
        <path d="M34 56 L22 70 L30 72 L40 60Z" fill="#a95a2c"/><path d="M78 58 L90 70 L82 72 L72 62Z" fill="#a95a2c"/>
      </g>
      <g class="legs-b" stroke="#3b1f10" stroke-width="2.5" stroke-linejoin="round">
        <path d="M36 58 L44 72 L52 70 L44 56Z" fill="#a95a2c"/><path d="M76 58 L68 72 L76 73 L84 60Z" fill="#a95a2c"/>
      </g>
      <g class="legs-sit" stroke="#3b1f10" stroke-width="2.5" stroke-linejoin="round">
        <ellipse cx="40" cy="64" rx="13" ry="8" fill="#a95a2c"/><path d="M74 58 L76 72 L84 72 L80 58Z" fill="#a95a2c"/>
      </g>
      <!-- body -->
      <ellipse cx="56" cy="48" rx="28" ry="17" fill="url(#fur)" stroke="#3b1f10" stroke-width="2.5"/>
      <ellipse cx="64" cy="54" rx="15" ry="9" fill="#f3d6ac"/>
      <!-- head -->
      <g class="sq-head">
        <path d="M74 22 L76 6 L86 18Z" fill="#c06a36" stroke="#3b1f10" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M77 18 L78 10 L83 17Z" fill="#f0a6a0"/>
        <circle cx="86" cy="32" r="16" fill="url(#fur)" stroke="#3b1f10" stroke-width="2.5"/>
        <ellipse cx="98" cy="37" rx="9" ry="7" fill="#f3d6ac" stroke="#3b1f10" stroke-width="2"/>
        <circle cx="105" cy="34" r="3" fill="#3b1f10"/>
        <ellipse cx="84" cy="40" rx="4" ry="2.6" fill="#f08a7a" opacity=".55"/>
        <g class="eye-open"><circle cx="90" cy="28" r="3.6" fill="#1b0f08"/><circle cx="91.3" cy="26.6" r="1.2" fill="#fff"/></g>
        <path class="eye-shut" d="M86 28 Q90 31 94 28" fill="none" stroke="#1b0f08" stroke-width="2.2" stroke-linecap="round"/>
        <path class="mouth" d="M98 42 Q101 45 104 42" fill="none" stroke="#3b1f10" stroke-width="1.8" stroke-linecap="round"/>
        <path class="tongue" d="M99 43 Q101 51 104 44Z" fill="#e8606a" stroke="#3b1f10" stroke-width="1.4"/>
      </g>
      <!-- arm -->
      <path class="sq-arm" d="M74 46 L84 54 L80 58 L70 50Z" fill="#a95a2c" stroke="#3b1f10" stroke-width="2.2" stroke-linejoin="round"/>
      <path class="sweat" d="M70 6 Q73 12 70 15 Q67 12 70 6Z" fill="#9fd4f2" stroke="#3b7aa8" stroke-width="1.2"/>
    </g>
  </g>
  <!-- the front rim -->
  <circle cx="120" cy="120" r="104" fill="none" stroke="#3b1f10" stroke-width="3"/>
</svg>
