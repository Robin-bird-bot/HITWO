<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hike in the Woods — challenge pop-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<style>
@font-face{font-family:'EditUndo';src:url(/_blob/5f302223387e626fdc9a5f5df6ebee5c) format('truetype');font-display:block}
body{margin:0}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1600px; height: 1000px; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #F1EADB; background: #DCE3D8">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Main" show-hints="{{false}}" hint-size="1600px,1000px"></dc-import></div>
<div style="position: absolute; inset: 0; background: rgba(14,19,17,0.66)"></div>

<div style="position: absolute; left: 390px; top: 25px; width: 820px; height: 950px; box-sizing: border-box; background: #1D2220; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 24px; flex: none">
<span style="font-family: 'EditUndo', monospace; font-size: 32px; letter-spacing: 0.04em; flex: 1">{{title}}</span>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="1"><img src="{{n}}" alt="Node" style="width: 30px; height: 35px; display: block"></sc-for>
</div>
<div style="display: flex; align-items: center; height: 32px; padding: 0 24px; background: {{bandColor}}; color: #1D2220; flex: none">
<span style="font-family: 'EditUndo', monospace; font-size: 14px; letter-spacing: 0.06em; flex: 1">{{band}}</span>
<div style="display: flex; align-items: center; gap: 6px"><dc-import name="Ic" icon="{{scopeIcon}}" color="#1D2220" size="15" sw="2.25" hint-size="15px,15px"></dc-import><span style="font-family: 'EditUndo', monospace; font-size: 12px; letter-spacing: 0.04em">{{scope}}</span></div>
</div>

<div style="position: relative; height: 168px; flex: none">
<img src="{{art}}" alt="{{title}}" style="width: 100%; height: 168px; object-fit: cover; display: block">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(rgba(29,34,32,0), #1D2220)"></div>
<span style="position: absolute; left: 24px; bottom: 12px; right: 24px; font-size: 14px; font-style: italic; color: #D8D1C2">{{quote}}</span>
</div>

<div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 24px 20px">

<div style="display: flex; gap: 16px; align-items: stretch">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; line-height: 1.45">{{desc}}</span>
<span style="font-size: 12px; color: #9C9585">{{note}}</span>
</div>
<div style="width: 210px; flex: none; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; background: rgba(229,98,74,0.14); border: 1px solid rgba(229,98,74,0.45); display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'EditUndo', monospace; font-size: 11px; letter-spacing: 0.06em; color: #F39A86">IF NOT</span>
<span style="font-size: 13px">{{fail}}</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'EditUndo', monospace; font-size: 12px; letter-spacing: 0.06em; color: #9C9585">{{reqHeader}}</span>
<span style="font-size: 12px; color: #9C9585">{{reqHint}}</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid {{r.border}}">
<div style="width: 140px; flex: none; display: flex; align-items: center; gap: 10px">
<sc-for list="{{r.faces}}" as="f" hint-placeholder-count="1"><img src="{{f.img}}" alt="{{f.name}}" style="width: {{r.faceSize}}px; height: {{r.faceSize}}px; border-radius: 50%; object-fit: cover; display: block; flex: none; margin-right: {{r.overlap}}px; box-shadow: 0 0 0 2px {{f.color}}, 0 0 0 4px #262C29"></sc-for>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-left: {{r.nameGap}}px"><span style="font-family: 'EditUndo', monospace; font-size: 13px; letter-spacing: 0.03em">{{r.name}}</span><span style="font-size: 11px; color: #9C9585">{{r.sub}}</span></div>
</div>
<div style="flex: 1; display: flex; align-items: center; gap: 10px">
<div style="display: flex; gap: 6px; padding: 6px; border-radius: 10px; background: {{r.aBg}}; opacity: {{r.aOp}}">
<sc-for list="{{r.a}}" as="s" hint-placeholder-count="1">
<div style="position: relative; width: {{s.w}}px; height: {{s.h}}px; box-sizing: border-box; border-radius: 7px; border: {{s.border}}; background: {{s.bg}}; box-shadow: {{s.glow}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{s.filled}}" hint-placeholder-val="{{false}}"><img src="{{s.img}}" alt="{{s.label}}" style="width: {{s.iw}}px; height: {{s.ih}}px; border-radius: 6px; object-fit: {{s.fit}}; display: block"></sc-if>
<sc-if value="{{s.empty}}" hint-placeholder-val="{{true}}"><span style="font-family: 'EditUndo', monospace; font-size: 11px; color: {{s.labelColor}}">{{s.label}}</span></sc-if>
<sc-if value="{{s.hasGiver}}" hint-placeholder-val="{{false}}"><img src="{{s.giverImg}}" alt="Given by {{s.giver}}" style="position: absolute; right: -6px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px {{s.giverColor}}, 0 0 0 3px #1D2220"></sc-if>
</div>
</sc-for>
</div>
<span style="font-family: 'EditUndo', monospace; font-size: 11px; color: #8D877A">OR</span>
<div style="display: flex; gap: 6px; padding: 6px; border-radius: 10px; background: {{r.bBg}}; opacity: {{r.bOp}}">
<sc-for list="{{r.b}}" as="s" hint-placeholder-count="3">
<div style="position: relative; width: {{s.w}}px; height: {{s.h}}px; box-sizing: border-box; border-radius: 7px; border: {{s.border}}; background: {{s.bg}}; box-shadow: {{s.glow}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{s.filled}}" hint-placeholder-val="{{false}}"><img src="{{s.img}}" alt="{{s.label}}" style="width: {{s.iw}}px; height: {{s.ih}}px; border-radius: 6px; object-fit: {{s.fit}}; display: block"></sc-if>
<sc-if value="{{s.empty}}" hint-placeholder-val="{{true}}"><span style="font-family: 'EditUndo', monospace; font-size: 11px; color: {{s.labelColor}}">{{s.label}}</span></sc-if>
<sc-if value="{{s.hasGiver}}" hint-placeholder-val="{{false}}"><img src="{{s.giverImg}}" alt="Given by {{s.giver}}" style="position: absolute; right: -6px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px {{s.giverColor}}, 0 0 0 3px #1D2220"></sc-if>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; flex: none">
<span style="font-family: 'EditUndo', monospace; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: {{r.statusBg}}; color: {{r.statusFg}}; white-space: nowrap">{{r.status}}</span>
<sc-if value="{{r.hasButtons}}" hint-placeholder-val="{{true}}">
<button aria-label="Pay and pass" style="width: 32px; height: 32px; border-radius: 8px; border: none; background: {{r.passBg}}; display: flex; align-items: center; justify-content: center; padding: 0"><dc-import name="Ic" icon="check" color="{{r.passFg}}" size="16" sw="2.5" hint-size="16px,16px"></dc-import></button>
<button aria-label="Skip and take the penalty" style="width: 32px; height: 32px; border-radius: 8px; border: none; background: {{r.failBg}}; display: flex; align-items: center; justify-content: center; padding: 0"><dc-import name="Ic" icon="x" color="{{r.failFg}}" size="16" sw="2.5" hint-size="16px,16px"></dc-import></button>
</sc-if>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'EditUndo', monospace; font-size: 12px; letter-spacing: 0.06em; color: #9C9585">ON THIS TILE</span>
<span style="font-size: 12px; color: #9C9585">Tap or drag a highlighted card into a slot</span>
</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{inv}}" as="v" hint-placeholder-count="3">
<div style="flex: 1; min-width: 0; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px"><img src="{{v.img}}" alt="{{v.name}}" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px {{v.color}}"><span style="font-family: 'EditUndo', monospace; font-size: 12px; letter-spacing: 0.03em">{{v.name}}</span></div>
<div style="display: flex; gap: 6px; min-height: 64px">
<sc-for list="{{v.items}}" as="it" hint-placeholder-count="3">
<div style="position: relative; width: 46px; height: 64px; border-radius: 6px; opacity: {{it.op}}; box-shadow: {{it.glow}}"><img src="{{it.img}}" alt="{{it.label}}" style="width: 46px; height: 64px; border-radius: 6px; object-fit: cover; display: block"><sc-if value="{{it.used}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; border-radius: 6px; background: rgba(29,34,32,0.6); display: flex; align-items: center; justify-content: center"><dc-import name="Ic" icon="check" color="#7FC29B" size="20" sw="3" hint-size="20px,20px"></dc-import></div></sc-if></div>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{v.res}}" as="rs" hint-placeholder-count="3">
<div style="position: relative; width: 38px; height: 38px; border-radius: 8px; background: rgba(255,255,255,0.07); opacity: {{rs.op}}; box-shadow: {{rs.glow}}; display: flex; align-items: center; justify-content: center"><img src="{{rs.img}}" alt="{{rs.label}}" style="width: 28px; height: 28px; object-fit: contain; border-radius: 5px; display: block"><span style="position: absolute; right: -4px; bottom: -4px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 3px; border-radius: 8px; background: #F1EADB; color: #1D2220; font-family: 'EditUndo', monospace; font-size: 10px; display: flex; align-items: center; justify-content: center">{{rs.n}}</span><sc-if value="{{rs.used}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; border-radius: 8px; background: rgba(29,34,32,0.6); display: flex; align-items: center; justify-content: center"><dc-import name="Ic" icon="check" color="#7FC29B" size="16" sw="3" hint-size="16px,16px"></dc-import></div></sc-if></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>

<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: 1; font-size: 13px; color: #C9C2B2">{{summary}}</span>
<sc-if value="{{showSkip}}" hint-placeholder-val="{{false}}"><button style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(229,98,74,0.6); background: transparent; color: #F39A86; font-size: 13px; font-weight: 600">Skip and take the penalty</button></sc-if>
<button style="height: 48px; padding: 0 22px; border-radius: 12px; border: none; background: #E9B44C; color: #1D2220; opacity: {{resolveOp}}; font-family: 'EditUndo', monospace; font-size: 14px; letter-spacing: 0.04em">{{resolve}}</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["each","party"],"default":"each"},"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const H = {
      fin: { name: 'Finnegan', color: '#E2683C', img: '/_blob/7b8ad9f6a4298c288e6a15731ec54e88' },
      cody: { name: 'Cody', color: '#4A8FD4', img: '/_blob/7b8ad9f6a4298c288e6a15731ec54e88' },
      gpa: { name: 'Grandpa W.', color: '#A06CC9', img: '/_blob/7b8ad9f6a4298c288e6a15731ec54e88' }
    };
    const IMG = {
      trailmix: '/_blob/4beab4e252adb90fcf4f29003004d6cd', bandages: '/_blob/711bf65ac90115e48a1578e222110587',
      hatchet: '/_blob/e726c75784d2b9824a0df743c3c04d62', net: '/_blob/6f38e12a131e1ac32deef39a01b17060',
      shovel: '/_blob/67c46012569d420a9e91fe5ab4277ddc', jerky: '/_blob/5a952c32c58333153c14b6a6e76fe388',
      wood: '/_blob/9860e28074fba65968a6ab1741cb8126', moss: '/_blob/ef7c352963a2583984ae4b1bcb4a5824',
      stone: '/_blob/bea2acfc5c3b1835667daa791a8a6519', clay: '/_blob/42be830d761f29f39b2cf46d4367bae3',
      meat: '/_blob/e743e590f023b5d0c660d85aa570d8b8', fish: '/_blob/144aa87d46e9e10dd3d4696ae61d295e',
      mushroom: '/_blob/ad5e1e35dcb474d44df8e6aa86ce5d71'
    };
    const NODE = { wildlife: '/_blob/61a42a071acb764f0eefe05f3d20b707', forest: '/_blob/62add56add8cdc44bdd2947049f865be', mountain: '/_blob/4b0866cf116a003081b38798aa257cef' };
    const GLOW = '0 0 0 2px #E9B44C, 0 0 14px rgba(233,180,76,0.45)';
    const base = { hasGiver: false, giver: '', giverImg: '', giverColor: '#1D2220', glow: 'none', labelColor: '#8D877A' };
    const cardSlot = (img, label, giver) => Object.assign({}, base, img
      ? { filled: true, empty: false, img, label, w: 44, h: 62, iw: 44, ih: 62, fit: 'cover', border: 'none', bg: 'transparent' }
      : { filled: false, empty: true, img: '', label, w: 44, h: 62, iw: 0, ih: 0, fit: 'cover', border: '1.5px dashed rgba(255,255,255,0.28)', bg: 'rgba(255,255,255,0.03)' },
      giver ? { hasGiver: true, giver: giver.name, giverImg: giver.img, giverColor: giver.color } : {});
    const resSlot = (img, label, giver) => Object.assign({}, base, img
      ? { filled: true, empty: false, img, label, w: 44, h: 44, iw: 34, ih: 34, fit: 'contain', border: '1.5px solid rgba(127,194,155,0.7)', bg: 'rgba(255,255,255,0.07)' }
      : { filled: false, empty: true, img: '', label, w: 44, h: 44, iw: 0, ih: 0, fit: 'contain', border: '1.5px dashed rgba(255,255,255,0.28)', bg: 'rgba(255,255,255,0.03)' },
      giver ? { hasGiver: true, giver: giver.name, giverImg: giver.img, giverColor: giver.color } : {});
    const target = (s) => Object.assign(s, { border: '2px dashed #E9B44C', glow: '0 0 0 4px rgba(233,180,76,0.16)', labelColor: '#E9B44C' });
    const ON = { bg: 'rgba(233,180,76,0.10)', op: 1 };
    const OFF = { bg: 'transparent', op: 0.35 };
    const STATUS = {
      pass: { status: 'PASSES', statusBg: 'rgba(127,194,155,0.2)', statusFg: '#A6DDBC', passBg: '#7FC29B', passFg: '#1D2220', failBg: 'rgba(255,255,255,0.08)', failFg: '#8D877A', border: 'rgba(127,194,155,0.45)' },
      pending: { status: 'NEEDS 1 MORE', statusBg: 'rgba(233,180,76,0.2)', statusFg: '#F2C978', passBg: 'rgba(255,255,255,0.08)', passFg: '#8D877A', failBg: 'rgba(255,255,255,0.08)', failFg: '#8D877A', border: 'rgba(233,180,76,0.45)' },
      fail: { status: 'TAKES INJURY', statusBg: 'rgba(229,98,74,0.2)', statusFg: '#F39A86', passBg: 'rgba(255,255,255,0.08)', passFg: '#8D877A', failBg: '#E5624A', failFg: '#1D2220', border: 'rgba(229,98,74,0.45)' }
    };
    const row = (who, a, aOn, b, bOn, st, sub) => Object.assign({
      name: who.name.toUpperCase(), sub, faces: [who], faceSize: 40, overlap: 0, nameGap: 0, hasButtons: true,
      a, aBg: aOn ? ON.bg : OFF.bg, aOp: aOn ? ON.op : OFF.op,
      b, bBg: bOn ? ON.bg : OFF.bg, bOp: bOn ? ON.op : OFF.op
    }, STATUS[st]);
    const item = (img, label, state) => ({ img, label, used: state === 'used', op: state === 'off' ? 0.3 : 1, glow: state === 'fits' ? GLOW : 'none' });
    const res = (img, label, n, state) => ({ img, label, n, used: state === 'used', op: state === 'off' ? 0.3 : 1, glow: state === 'fits' ? GLOW : 'none' });
    const mode = this.props.mode === 'party' ? 'party' : 'each';

    if (mode === 'each') {
      return {
        title: 'BEAR!!', nodes: [NODE.wildlife], bandColor: '#D9434B', band: 'CHALLENGE · TIER II', scope: 'EACH HIKER ON THIS TILE', scopeIcon: 'users',
        art: '/_blob/04155a947a9320ded82bc52429c4ccac', quote: '“THERE’S A BEAR THERE’S A BEAR THERE’S A BEAR!!!”',
        desc: 'Every hiker on this tile must give up 1 Food card, or 3 of Fish, Meat or Mushroom.',
        note: 'Each hiker pays for themselves. Hikers can still pass resources to each other first.',
        fail: 'That hiker takes 1 injury.',
        reqHeader: 'EACH HIKER NEEDS', reqHint: '1 Food card  or  3 Fish / Meat / Mushroom',
        rows: [
          row(H.fin, [cardSlot(IMG.trailmix, 'Trail Mix')], true, [resSlot(null, '+'), resSlot(null, '+'), resSlot(null, '+')], false, 'pass', 'Paid with Trail Mix'),
          row(H.cody, [cardSlot(null, 'FOOD')], false, [resSlot(IMG.meat, 'Meat'), resSlot(IMG.meat, 'Meat'), target(resSlot(null, '+'))], true, 'pending', '2 of 3 resources'),
          row(H.gpa, [cardSlot(null, 'FOOD')], false, [resSlot(null, '+'), resSlot(null, '+'), resSlot(null, '+')], false, 'fail', 'Nothing that fits')
        ],
        inv: [
          Object.assign({}, H.fin, { name: 'FINNEGAN', items: [item(IMG.trailmix, 'Trail Mix', 'used'), item(IMG.bandages, 'Bandages', 'off'), item(IMG.hatchet, 'Hatchet', 'off')], res: [res(IMG.fish, 'Fish', 1, 'fits'), res(IMG.wood, 'Wood', 2, 'off'), res(IMG.moss, 'Moss', 1, 'off')] }),
          Object.assign({}, H.cody, { name: 'CODY', items: [item(IMG.net, 'Net', 'off')], res: [res(IMG.meat, 'Meat', 2, 'used'), res(IMG.fish, 'Fish', 1, 'fits'), res(IMG.stone, 'Stone', 1, 'off')] }),
          Object.assign({}, H.gpa, { name: 'GRANDPA W.', items: [item(IMG.shovel, 'Shovel', 'off')], res: [res(IMG.clay, 'Clay', 1, 'off'), res(IMG.stone, 'Stone', 1, 'off')] })
        ],
        summary: 'Finnegan passes · Cody needs 1 more (Finnegan or Cody can add a Fish) · Grandpa W. takes 1 injury',
        showSkip: false, resolve: 'RESOLVE', resolveOp: 0.5
      };
    }
    return {
      title: 'FALLEN TREE', nodes: [NODE.forest, NODE.mountain], bandColor: '#D9434B', band: 'CHALLENGE · TIER II', scope: 'WHOLE PARTY ON THIS TILE', scopeIcon: 'users',
      art: '/_blob/67e357b388845c9e2b0fd48619890139', quote: '“A large tree blocks the path. You could clear it… or just brute force your way over.”',
      desc: 'The party must give up 2 Tools, or 4 Wood, to clear the path. Any hiker on this tile can chip in.',
      note: 'Amounts come from the card template and grow with the tier.',
      fail: 'Every hiker on this tile loses 1 Energy.',
      reqHeader: 'THE PARTY NEEDS', reqHint: '2 Tool cards  or  4 Wood',
      rows: [
        Object.assign({
          name: 'PARTY', sub: 'Finnegan, Cody, Grandpa W.', faces: [H.fin, H.cody, H.gpa], faceSize: 30, overlap: -12, nameGap: 12, hasButtons: false,
          a: [cardSlot(IMG.shovel, 'Shovel', H.gpa), target(cardSlot(null, 'TOOL'))], aBg: ON.bg, aOp: 1,
          b: [resSlot(null, 'WOOD'), resSlot(null, 'WOOD'), resSlot(null, 'WOOD'), resSlot(null, 'WOOD')], bBg: OFF.bg, bOp: OFF.op
        }, STATUS.pending, { status: '1 OF 2 TOOLS' })
      ],
      inv: [
        Object.assign({}, H.fin, { name: 'FINNEGAN', items: [item(IMG.trailmix, 'Trail Mix', 'off'), item(IMG.bandages, 'Bandages', 'off'), item(IMG.hatchet, 'Hatchet', 'fits')], res: [res(IMG.wood, 'Wood', 2, 'fits'), res(IMG.fish, 'Fish', 1, 'off'), res(IMG.moss, 'Moss', 1, 'off')] }),
        Object.assign({}, H.cody, { name: 'CODY', items: [item(IMG.net, 'Net', 'fits')], res: [res(IMG.meat, 'Meat', 2, 'off'), res(IMG.stone, 'Stone', 1, 'off')] }),
        Object.assign({}, H.gpa, { name: 'GRANDPA W.', items: [item(IMG.shovel, 'Shovel', 'used')], res: [res(IMG.clay, 'Clay', 1, 'off'), res(IMG.stone, 'Stone', 1, 'off')] })
      ],
      summary: 'Grandpa W. gave the Shovel. One more Tool from Finnegan (Hatchet) or Cody (Net) clears the tree.',
      showSkip: true, resolve: 'NEEDS 1 MORE TOOL', resolveOp: 0.5
    };
  }
}
</script>
</body>
</html>
