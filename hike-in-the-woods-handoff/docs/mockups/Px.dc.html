<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(8, {{cell}}px); grid-auto-rows: {{cell}}px; width: {{w}}px; height: {{w}}px; flex: none">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="64"><div style="background: {{c.bg}}"></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["forest","river","wildlife","mountain","energy","apple","heart","cap","sun","sunrise","moon","rain","cloud","tent","star","alert","fork","sign","box","eye","cart","cross","check","question","tower","fire","move","group","basket","hammer","sprout","book","shirt","boot","pack","menu","plus","minus","target","clover"],"default":"forest"},"color":{"editor":"color","default":"#1E2B27"},"color2":{"editor":"color","default":""},"px":{"editor":"int","default":8,"min":1,"max":16},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      forest: ["...#....","..###...",".#####..","..###...",".#####..","#######.","...+....","...+...."],
      river: ["...#....","...#....","..###...",".#####..","#######.","#######.",".#####..","..###..."],
      wildlife: [".##..##.",".##..##.","#......#","#.####.#",".######.",".######.","..####..","........"],
      mountain: ["........","...#....","..+++...",".#####..",".######.","########","########","........"],
      energy: ["....##..","...##...","..##....",".######.","....##..","...##...","..##....",".##....."],
      apple: ["....+...","...+....",".##.##..","#######.","#######.","#######.",".#####..","..#.#..."],
      heart: ["........",".##.##..","#######.","#######.",".#####..","..###...","...#....","........"],
      cap: ["...+....",".+++++..","+++++++.","#######.",".#####..",".#####..","..###...","...#...."],
      sun: ["...#....",".#.#.#..","..###...","#######.","..###...",".#.#.#..","...#....","........"],
      sunrise: ["........","........","...#....",".#.#.#..","..###...","#######.","........","++++++++"],
      moon: ["..###...",".##.....","##......","##......","##......",".##.....","..###...","........"],
      rain: ["...##...",".######.","########",".######.","........","+..+..+.",".+..+..+","........"],
      cloud: ["........","...##...",".######.","########","########",".######.","........","........"],
      tent: ["...#....","..###...","..#+#...",".##+##..",".##+##..","###+###.","#######.","........"],
      star: ["...#....","..###...","#######.",".#####..","..###...",".##.##..",".#...#..","........"],
      alert: ["..##....","..##....","..##....","..##....","..##....","........","..##....","........"],
      fork: ["#.....#.",".#...#..","..#.#...","...#....","...#....","...#....","...#....","........"],
      sign: [".######.",".######.",".######.","...+....","...+....","...+....","..+++...","........"],
      box: ["########","#..##..#","########","#......#","#......#","#......#","########","........"],
      eye: ["........","..####..",".#....#.","#..##..#","#..##..#",".#....#.","..####..","........"],
      cart: ["........","#.......",".######.",".#....#.",".######.","........","..+..+..","........"],
      cross: ["........","...##...","...##...",".######.",".######.","...##...","...##...","........"],
      check: ["........",".......#","......#.","#....#..",".#..#...","..##....","........","........"],
      question: ["..###...",".#...#..",".....#..","....#...","...#....","...#....","........","...#...."],
      tower: [".#####..",".#+++#..",".#####..","..#.#...","..###...","..#.#...",".#...#..","#.....#."],
      fire: ["...#....","...##...","..###...",".#####..",".#####..","..###...","+.+.+.+.",".+.+.+.."],
      move: [".##.....",".##.....",".##..##.",".....##.",".##..##.",".##.....",".....##.",".....##."],
      group: ["........",".#...#..","###.###.",".#...#..","###.###.","#.#.#.#.","#.#.#.#.","........"],
      basket: ["........","..####..",".#....#.","########","#.#.#.#.",".#.#.#..",".######.","........"],
      hammer: ["#####...","#####...","..+.....","..+.....","..+.....","..+.....","..+.....","........"],
      sprout: ["........",".##.##..","..#.#...","...+....","...+....","...+....",".#####..","........"],
      book: [".######.","#......#","#.####.#","#......#","#.####.#","#......#",".######.","........"],
      shirt: [".##..##.","########","########",".######.",".######.",".######.",".######.","........"],
      boot: [".###....",".###....",".###....",".###....",".######.",".#######",".#######","........"],
      pack: ["...##...","..####..",".######.",".#+##+#.",".######.",".#....#.",".######.","........"],
      menu: ["........","#######.","........","#######.","........","#######.","........","........"],
      plus: ["........","...#....","...#....",".#####..","...#....","...#....","........","........"],
      minus: ["........","........","........",".#####..","........","........","........","........"],
      target: ["..###...",".#...#..","#..#..#.","#.###.#.","#..#..#.",".#...#..","..###...","........"],
      clover: ["........",".##.##..",".##.##..","...#....",".##.##..",".##.##..","....+...","....+..."]
    };
    const bm = I[this.props.icon] || I.question;
    const c1 = this.props.color || '#1E2B27';
    const c2 = this.props.color2 || c1;
    const cells = bm.join('').split('').map((ch) => ({ bg: ch === '#' ? c1 : ch === '+' ? c2 : 'transparent' }));
    const cell = this.props.px ?? 8;
    return { cells, cell, w: cell * 8 };
  }
}
</script>
</body>
</html>
