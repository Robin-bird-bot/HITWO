* { box-sizing: border-box; }
body { margin: 0; background: #141A18; }
#board { position: relative; width: 1600px; height: 1000px; overflow: hidden; color: #F7F1E4; font-family: system-ui, sans-serif; }
h1 { position: absolute; left: 40px; top: 18px; margin: 0; font: normal 22px EditUndo; letter-spacing: 2px; }
.sub { position: absolute; left: 40px; top: 52px; font-size: 13px; color: #A9B1AC; }
.lab { position: absolute; width: 220px; text-align: center; font: 10.5px EditUndo; letter-spacing: 1px; color: #E9B44C; line-height: 1.5; }
.lab small { display: block; color: #A9B1AC; font: 11px system-ui; letter-spacing: 0; margin-top: 2px; }

/* the shell: the TrailMate's body, in the item type's color */
.gc { position: absolute; width: 220px; height: 308px; border-radius: 26px; background: linear-gradient(160deg, var(--l), var(--d));
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.35), 0 14px 26px rgba(0,0,0,.55); }
.gc.t2 { box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.35), 0 0 0 3px #d9e2ea, 0 0 0 5px #6e7a84, 0 0 22px 4px rgba(220,230,240,.35), 0 14px 26px rgba(0,0,0,.55); }
.nub { position: absolute; width: 6px; background: #1C201E; border-radius: 3px; }
.spk { position: absolute; left: 50%; top: 8px; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: #1C201E; opacity: .85; }
.face { position: absolute; left: 10px; right: 10px; top: 19px; bottom: 28px; border-radius: 18px; background: #1C201E; box-shadow: inset 0 0 0 2px #0e120e; }
.scr { position: absolute; inset: 7px; border-radius: 11px; overflow: hidden; background: #BAC995;
  background-image: linear-gradient(rgba(82,101,63,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(82,101,63,.14) 1px, transparent 1px); background-size: 16px 16px; }
.scr::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(0,0,0,.22) 100%), linear-gradient(135deg, rgba(255,255,255,.16), transparent 40%); }
.hud { position: absolute; left: 6px; right: 6px; top: 6px; height: 20px; border-radius: 4px; background: #1D2918; box-shadow: 0 1.5px 0 #111A10; display: flex; align-items: center; gap: 6px; padding: 0 6px; font: 10px EditUndo; letter-spacing: 1.2px; color: var(--a); }
.hud .ti { width: 12px; height: 14px; background: var(--a); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
.hud .slot { color: #A0B37D; }
.hud .tier { margin-left: auto; padding: 1px 5px; border-radius: 3px; font-size: 10px; color: #1D2918; background: linear-gradient(160deg, #F1F5F8, #9AA8B4); }
.art { position: absolute; left: 50%; top: 33px; width: 118px; height: 118px; margin-left: -59px; image-rendering: pixelated; }
.art.col { image-rendering: auto; filter: drop-shadow(0 3px 2px rgba(17,26,16,.4)); }
.brk { position: absolute; left: 50%; top: 31px; width: 132px; height: 122px; margin-left: -66px; }
.brk i { position: absolute; width: 16px; height: 16px; border: 0 solid var(--a); filter: drop-shadow(0 0 1px #111A10) drop-shadow(0 0 1px #111A10); }
.brk i:nth-child(1) { left: 0; top: 0; border-width: 4px 0 0 4px; } .brk i:nth-child(2) { right: 0; top: 0; border-width: 4px 4px 0 0; }
.brk i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 4px 4px; } .brk i:nth-child(4) { right: 0; bottom: 0; border-width: 0 4px 4px 0; }
.gc.t2 .brk i { border-color: #F1F5F8; }
.nm { position: absolute; left: 6px; right: 6px; top: 156px; text-align: center; font: 15px EditUndo; letter-spacing: 1px; color: #1D2918; }
.ds { position: absolute; left: 9px; right: 9px; top: 175px; text-align: center; font: 12.5px/1.18 Pixelify; color: #2B3A23; }

.bt .q { display: flex; gap: 4px; margin-top: 3px; } .bt .q i { width: 6px; height: 6px; transform: rotate(45deg); box-shadow: inset 0 0 0 1.5px #52653F; }
.bt .c { text-align: right; } .bt .q i.f { background: #1D2918; box-shadow: none; }
.brand { position: absolute; left: 0; right: 0; bottom: 9px; text-align: center; font: 8px EditUndo; letter-spacing: 3px; color: rgba(20,20,20,.55); }
.leds { position: absolute; left: 0; right: 0; bottom: 9px; display: flex; justify-content: center; gap: 4px; }
.leds i { width: 8px; height: 8px; border-radius: 50%; background: #1C201E; box-shadow: inset 0 1px 1px rgba(255,255,255,.15); }
.leds i.on { background: #B8FFC8; box-shadow: 0 0 0 1.5px #2a7a3e, 0 0 7px 2px rgba(107,255,138,.85); }
.leds i.may { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(28,32,30,.8); }
.leds.sm { gap: 2px; bottom: 3px; } .leds.sm i { width: 5px; height: 5px; }

/* the back: like a walkie-talkie's, with the type icon embossed as the logo */
.gb::before { content: ''; position: absolute; inset: 0; border-radius: 26px; box-shadow: inset 0 0 0 6px rgba(28,32,30,.92); pointer-events: none; }
.gb .grip { position: absolute; top: 46px; bottom: 46px; width: 10px; border-radius: 5px; background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 3px, transparent 3px 7px); }
.gb .logo { position: absolute; left: 50%; top: 34px; width: 74px; height: 96px; margin-left: -37px; }
.gb .logo i { position: absolute; inset: 0; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
.gb .logo .hi { background: rgba(255,255,255,.45); transform: translate(1.5px, 1.5px); }
.gb .logo .lo { background: rgba(0,0,0,.42); transform: translate(-1px, -1px); }
.gb .logo .mid { background: var(--d); filter: brightness(.92); }
.gb .word { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font: 12px EditUndo; letter-spacing: 4px; color: var(--d); text-shadow: 1px 1px 0 rgba(255,255,255,.4), -1px -1px 0 rgba(0,0,0,.3); }
.gb .tname { position: absolute; left: 0; right: 0; top: 158px; text-align: center; font: 8px EditUndo; letter-spacing: 3px; color: rgba(0,0,0,.45); }
.gb .grl { position: absolute; left: 26px; right: 26px; top: 182px; bottom: 26px; border-radius: 14px; background: rgba(0,0,0,.2); box-shadow: inset 0 3px 4px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.35); display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 8px 0; }
.gb .grl i { display: block; width: 78%; height: 9px; border-radius: 5px; background: #1C201E; box-shadow: inset 0 2px 2px #000, 0 1px 0 rgba(255,255,255,.35); }
.gb .sc { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f5f5f5, #8a8f8c 60%, #3a3d3b); }
.gb .sc::after { content: ''; position: absolute; left: 2px; right: 2px; top: 4px; height: 1.5px; background: #3a3d3b; transform: rotate(40deg); }

/* in the bag: small screens */
.bag { position: absolute; width: 236px; padding: 12px; border-radius: 14px; background: linear-gradient(#232826, #181c1a); border: 2px solid #2f3531; }
.bag .h { font: 11px EditUndo; letter-spacing: 1.5px; color: #e8f2d6; margin-bottom: 8px; display: flex; justify-content: space-between; }
.bag .h span { color: #6f8a62; font-size: 9px; }
.bag .row { display: flex; gap: 6px; }
.mini { position: relative; width: 48px; height: 58px; border-radius: 10px; background: linear-gradient(160deg, var(--l), var(--d)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.mini .f { position: absolute; inset: 4px 4px 11px; border-radius: 6px; background: #1C201E; }
.mini .s { position: absolute; inset: 2px; border-radius: 4px; background: #BAC995; overflow: hidden; display: grid; place-items: center; }
.mini .s::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.1) 0 1px, transparent 1px 3px); }
.mini img { width: 34px; height: 34px; image-rendering: pixelated; }

.mini.empty { background: #0d130c; box-shadow: inset 0 0 0 2px #2a302c; }
.note { position: absolute; font-size: 12.5px; line-height: 1.45; color: #C9D3C4; }
.note b { color: #F7F1E4; }

  const max = inst ? inst.max ?? c.max : c.max, left = inst ? inst.left : c.min, may = inst ? 0 : c.max - c.min;

  const qual = v.type === 'shelter' ? 'NO QUALITY' : inst ? `QUALITY ${inst.q}<div class="q">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= inst.q ? 'f' : ''}"></i>`).join('')}</div>` : 'QUALITY ?<div class="q"><i></i><i></i><i></i><i></i><i></i></div>';
  return `<div class="gc${v.tier === 2 ? ' t2' : ''}" style="left:${x}px;top:${y}px;--l:${t.l};--d:${t.d};--a:${t.a};--ico:url(${ico(v.type)})">
    <span class="nub" style="left:-4px;top:92px;height:30px"></span><span class="nub" style="left:-4px;top:128px;height:30px"></span><span class="nub" style="right:-4px;top:110px;height:44px"></span><span class="spk"></span>
    <div class="face"><div class="scr">
      <div class="hud"><span class="ti"></span>${t.label}${v.slot ? `<span class="slot">· ${SLOT[v.slot]}</span>` : ''}${v.tier === 2 ? '<span class="tier">II</span>' : ''}</div>
      <div class="brk"><i></i><i></i><i></i><i></i></div>
      <img class="art" src="${v.g}">
      <div class="nm">${v.name.toUpperCase()}</div>
      <div class="ds" style="font-size:${v.range.length > 64 ? Math.max(10, 12.5 * Math.sqrt(64 / v.range.length)) : 12.5}px">${v.range}</div>
      <div class="bt"><div>${qual}</div><div class="c">${t.count}<br>${cnt}</div></div>
    </div></div>
    ${leds(max, left, may)}
  </div>`;
}
function back(type, x, y) {
  const t = T[type];
  return `<div class="gc gb" style="left:${x}px;top:${y}px;--l:${t.l};--d:${t.d};--ico:url(${ico(type)})">
    <span class="nub" style="right:-4px;top:92px;height:30px"></span><span class="nub" style="right:-4px;top:128px;height:30px"></span><span class="nub" style="left:-4px;top:110px;height:44px"></span><span class="spk" style="top:auto;bottom:8px"></span>
    <span class="grip" style="left:9px"></span><span class="grip" style="right:9px"></span>
    <span class="sc" style="left:16px;top:16px"></span><span class="sc" style="right:16px;top:16px"></span><span class="sc" style="left:16px;bottom:16px"></span><span class="sc" style="right:16px;bottom:16px"></span>
    <div class="logo"><i class="hi"></i><i class="lo"></i><i class="mid"></i></div>
    <div class="word">TRAILMATE</div><div class="tname">${t.label} · SUPPLY</div>
    <div class="grl"><i></i><i></i><i></i><i></i><i></i></div>
  </div>`;
}
function mini(k, left, max) { const v = D.items[k], t = T[v.type]; return `<div class="mini" style="--l:${t.l};--d:${t.d}"><div class="f"><div class="s"><img src="${v.g}"></div></div>${leds(max, left, 0, true)}</div>`; }
const lab = (x, y, t, s) => `<div class="lab" style="left:${x}px;top:${y}px">${t}<small>${s}</small></div>`;
let h = '';
const xs = [65, 315, 565, 815, 1065, 1315];
[['scanner', 'TOOL', '3 of 4 uses left', { q: 3, left: 3, max: 4 }], ['trailMix', 'FOOD', '2 of 3 bites left', { q: 2, left: 2, max: 3 }], ['rainJacket', 'CLOTHES · BODY', '5 of 6 durability left', { q: 4, left: 5, max: 6 }], ['tent', 'SHELTER', '3 of 4 set-ups left', { left: 3, max: 4 }],
 ['coffee', 'DRINK', 'Drinks restore Energy; 1 sip', { q: 3, left: 1, max: 1 }], ['camera', 'TIER II', 'A silver trim and a II chip', { q: 2, left: 2, max: 3 }]].forEach(([k, a, b, inst], i) => { h += front(k, xs[i], 96, inst) + lab(xs[i], 414, a, b); });
['tool', 'food', 'clothes', 'shelter'].forEach((t, i) => { h += back(t, xs[i], 520) + lab(xs[i], 838, 'THE BACK · ' + T[t].label, i ? '' : 'A walkie-talkie back, the type as its logo'); });
h += front('scanner', xs[4], 520) + lab(xs[4], 838, 'NOT ROLLED YET', 'Packing preview: lit = the least, rings = maybe');
h += `<div class="bag" style="left:${xs[5] - 8}px;top:520px"><div class="h">FINN'S BAG<span>4/4</span></div><div class="row">${mini('scanner', 3, 4)}${mini('trailMix', 2, 3)}${mini('rainJacket', 5, 6)}${mini('flannel', 7, 9)}</div></div>`;
h += `<div class="note" style="left:${xs[5] - 8}px;top:640px;width:250px"><b>LEDs along the bottom</b> count uses, bites, durability or set-ups: one per point it can have, lit for what's left. The same on the big card and in the bag.<br><br><b>Two styles:</b> park posters for the map and windows; TrailMate tech for items, minigames and the packing machine.</div>`;
document.getElementById('cards').innerHTML = h;
</script>
