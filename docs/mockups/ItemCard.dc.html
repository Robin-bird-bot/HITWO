<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
@font-face{font-family:'EditUndo';src:url(/_blob/5f302223387e626fdc9a5f5df6ebee5c) format('truetype');font-display:block}
body{margin:0}
@keyframes hikeGradShift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
@keyframes hikeRaySpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; border-radius: {{radius}}px; overflow: hidden; box-shadow: 0 12px 26px rgba(0,0,0,0.38); font-family: 'DM Sans', sans-serif; color: #F1EADB">
<div style="position: absolute; inset: 0; background: {{grad}}; background-size: 260% 260%; animation: hikeGradShift 9s ease-in-out infinite alternate"></div>
<sc-if value="{{isBack}}" hint-placeholder-val="{{true}}">
<img src="{{rays}}" alt="" style="position: absolute; left: {{rayL}}px; top: {{rayT}}px; width: {{rayS}}px; height: {{rayS}}px; opacity: 0.28; display: block; animation: hikeRaySpin 90s linear infinite">
<img src="/_blob/95646052a595ad72825aecb9f4f964ed" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.18; display: block">
<img src="{{icon}}" alt="{{typeLabel}} card back" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25))">
</sc-if>
<sc-if value="{{isFront}}" hint-placeholder-val="{{false}}">
<img src="{{frontBg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; left: {{artL}}px; top: {{artT}}px; width: {{artW}}px; height: {{artH}}px; overflow: hidden; -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%); mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%)">
<img src="{{rays}}" alt="" style="position: absolute; left: {{artRayL}}px; top: {{artRayT}}px; width: {{artRayS}}px; height: {{artRayS}}px; opacity: 0.4; display: block; animation: hikeRaySpin 90s linear infinite">
</div>
<img src="{{frontArt}}" alt="{{name}}" style="position: absolute; left: {{artImgL}}px; top: {{artImgT}}px; width: {{artImgW}}px; height: {{artImgH}}px; object-fit: contain; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35))">
<sc-if value="{{showTier}}" hint-placeholder-val="{{true}}"><div style="position: absolute; left: 0; right: 0; top: {{tierT}}px; display: flex; justify-content: center; pointer-events: none"><span style="font-family: 'EditUndo', monospace; font-size: {{tierFont}}px; line-height: 1; letter-spacing: 0.08em; background: {{tierBg}}; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(20,16,12,0.85)) drop-shadow(0 0 4px rgba(0,0,0,0.5))">{{tierNum}}</span></div></sc-if>
<div style="position: absolute; left: {{padX}}px; right: {{padX}}px; top: {{textT}}px; bottom: {{padB}}px; display: flex; flex-direction: column; align-items: center; gap: {{gap}}px; text-align: center">
<span style="font-family: 'EditUndo', monospace; font-size: {{nameSize}}px; line-height: 1.05; letter-spacing: 0.04em; color: #FFF3E3">{{name}}</span>
<span style="font-size: {{smallSize}}px; letter-spacing: 0.06em; text-transform: uppercase; color: {{accent}}">{{typeLabel}}{{slotLabel}}</span>
<span style="font-size: {{bodySize}}px; line-height: 1.35; color: #E9DFCC">{{effect}}</span>
<div style="flex: 1"></div>
<div style="align-self: stretch; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px">
<sc-if value="{{hasQuality}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; align-items: flex-start; gap: {{labelGap}}px"><span style="font-size: {{tinySize}}px; letter-spacing: 0.08em; color: #C9B9A0">QUALITY</span><div style="display: flex; align-items: center; gap: {{pipGap}}px; height: {{pipRow}}px"><sc-for list="{{pips}}" as="p" hint-placeholder-count="5"><div style="width: {{pipS}}px; height: {{pipS}}px; transform: rotate(45deg); background: {{p.bg}}"></div></sc-for></div></div></sc-if>
<sc-if value="{{noQuality}}" hint-placeholder-val="{{false}}"><span style="font-size: {{smallSize}}px; color: #A8977D">No quality</span></sc-if>
<sc-if value="{{hasCount}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; align-items: flex-end; gap: {{labelGap}}px"><span style="font-size: {{tinySize}}px; letter-spacing: 0.08em; color: #C9B9A0">{{countLabel}} {{left}}/{{max}}</span><div style="display: flex; align-items: center; gap: {{cGap}}px; height: {{pipRow}}px"><sc-for list="{{counts}}" as="c" hint-placeholder-count="4"><div style="width: {{c.w}}px; height: {{c.h}}px; border-radius: {{c.r}}; background: {{c.bg}}; box-shadow: {{c.ring}}"></div></sc-for></div></div></sc-if>
<sc-if value="{{showMeta}}" hint-placeholder-val="{{false}}"><span style="font-family: 'EditUndo', monospace; font-size: {{smallSize}}px; color: #F1EADB">{{meta}}</span></sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"type":{"editor":"enum","options":["tool","clothes","food","shelter","trinket"],"default":"tool"},"face":{"editor":"enum","options":["back","front"],"default":"back"},"name":{"editor":"text","default":"MEDKIT"},"tier":{"editor":"int","default":1,"min":1,"max":4},"slot":{"editor":"text","default":""},"effect":{"editor":"text","default":""},"quality":{"editor":"int","default":3,"min":0,"max":5},"meta":{"editor":"text","default":""},"art":{"editor":"text","default":""},"left":{"editor":"int","default":0,"min":0,"max":12},"max":{"editor":"int","default":0,"min":0,"max":12},"w":{"editor":"int","default":210},"$preview":{"width":210,"height":294}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const T = {
      tool: { label: 'Tool', colors: ['#ed642b', '#f08c35', '#f0ab35', '#ecf035'], accent: '#F2A65A', icon: '/_blob/eff06093e8d02ed474f0af02555f9612', rays: '/_blob/4f7a1b7138f9728d05ce146f1d07a295', count: 'USES', shape: 'square', fill: '#F2A65A' },
      clothes: { label: 'Clothes', colors: ['#5e3023', '#895637', '#c18553', '#e6b389'], accent: '#E6B389', icon: '/_blob/8e162ae1cf84b38a06f6a2f6f769e6d2', rays: '/_blob/fe42788abc963f221d2a5ed60d977bb0', count: 'DURABILITY', shape: 'bar', fill: '#E6B389' },
      food: { label: 'Food', colors: ['#3a7752', '#45a86c', '#c7da7b', '#dced9a'], accent: '#C7DA7B', icon: '/_blob/a7f59e3cb098a8622d22c554aece10b7', rays: '/_blob/4e0e8e23223b680e250a1cc64b3b43a2', count: 'BITES', shape: 'circle', fill: '#C7DA7B' },
      shelter: { label: 'Shelter', colors: ['#83c4ed', '#545c8e'], accent: '#83C4ED', icon: '/_blob/f2308665ee55d6b923a285d3f4644c5e', rays: '/_blob/dd8275fc91e8a49b7e086183a931caec', count: 'NIGHTS', shape: 'square', fill: '#83C4ED' },
      trinket: { label: 'Trinket', colors: ['#e2a9f1', '#d675ef', '#9a3f64', '#cd1f66'], accent: '#E2A9F1', icon: '/_blob/43bced8bda39764135239b64a63d8c7d', rays: '/_blob/f120802238791203b88cad57291a5f03', count: 'USES', shape: 'square', fill: '#E2A9F1' }
    };
    // Tier numeral colors: Tier 1 shows nothing; silver, gold, prismatic (Tier 4 only comes from Luck)
    const TIER = {
      1: { c: '#C98A4B', bg: 'linear-gradient(160deg, #E3AE73, #A8692F)', n: 'I' },
      2: { c: '#C9D3DC', bg: 'linear-gradient(160deg, #F1F5F8, #9AA8B4)', n: 'II' },
      3: { c: '#F2C14E', bg: 'linear-gradient(160deg, #FFE08A, #D79A1E)', n: 'III' },
      4: { c: '#CDA6EE', bg: 'linear-gradient(160deg, #7FD3E6, #CDA6EE, #F0875A)', n: 'IV' }
    };
    const t = T[p.type] || T.tool;
    const tierN = Math.min(4, Math.max(1, Number(p.tier ?? 1)));
    const tr = TIER[tierN];
    const W = Number(p.w ?? 210), H = Math.round(W * 1.4), k = W / 300;
    const c = t.colors;
    const grad = 'linear-gradient(155deg, ' + c.concat(c.slice(0, -1).reverse()).join(', ') + ')';
    const isBack = p.face !== 'front';
    const q = Number(p.quality ?? 0);
    const rayS = Math.round(H * 1.5);
    // art window = the cloud area of the front background (upper ~55%)
    const artL = Math.round(W * 0.08), artT = Math.round(H * 0.09), artW = Math.round(W * 0.84), artH = Math.round(H * 0.46);
    const artRayS = Math.round(artW * 1.6);
    const iconW = Math.round(W * 0.62), iconH = Math.round(H * 0.62);
    const hasArt = !!p.art, artS = Math.round(Math.min(artW, artH) * 0.94);
    const artImg = hasArt
      ? { L: artL + Math.round((artW - artS) / 2), T: artT + Math.round((artH - artS) / 2), W: artS, H: artS }
      : { L: Math.round((W - iconW) / 2), T: Math.round(H * 0.32 - iconH / 2), W: iconW, H: iconH };
    // uses / bites / durability counter
    const max = Math.max(0, Number(p.max ?? 0)), left = Math.min(max, Math.max(0, Number(p.left ?? max)));
    const pipRow = Math.max(6, Math.round(14 * k));
    const shape = t.shape;
    const cw = shape === 'bar' ? Math.max(3, Math.round((max > 8 ? 5 : 7) * k)) : Math.max(5, Math.round(12 * k));
    const ch = shape === 'bar' ? pipRow : cw;
    const counts = Array.from({ length: max }, (_, i) => {
      const on = i < left;
      return { w: cw, h: ch, r: shape === 'circle' ? '50%' : (shape === 'bar' ? '2px' : '3px'), bg: on ? t.fill : 'transparent', ring: on ? 'none' : 'inset 0 0 0 ' + Math.max(1, Math.round(1.5 * k)) + 'px rgba(255,255,255,0.35)' };
    });
    return {
      w: W, h: H, radius: Math.round(W * 0.075), grad, isBack, isFront: !isBack, icon: t.icon, rays: t.rays,
      frontBg: '/_blob/8151f14f82a9f2cf296c3a615ff3ea2b', frontArt: hasArt ? p.art : t.icon,
      artImgL: artImg.L, artImgT: artImg.T, artImgW: artImg.W, artImgH: artImg.H,
      rayS, rayL: Math.round((W - rayS) / 2), rayT: Math.round((H - rayS) / 2),
      artL, artT, artW, artH, artRayS, artRayL: Math.round((artW - artRayS) / 2), artRayT: Math.round((artH - artRayS) / 2),
      tierBg: tr.bg, tierNum: tr.n, showTier: tierN >= 2, tierT: Math.round(H * 0.03), tierFont: Math.max(8, Math.round(W * 0.1)),
      padX: Math.round(W * 0.09), padB: Math.round(H * 0.055), textT: Math.round(H * 0.575), gap: Math.max(2, Math.round(4 * k)),
      nameSize: Math.max(10, Math.round(24 * k)), smallSize: Math.max(7, Math.round(12 * k)), bodySize: Math.max(8, Math.round(14.5 * k)), tinySize: Math.max(6, Math.round(10 * k)), labelGap: Math.max(1, Math.round(3 * k)),
      name: p.name || '', typeLabel: t.label, slotLabel: p.slot ? ' · ' + p.slot : '', accent: t.accent,
      effect: p.effect || '', meta: p.meta || '',
      hasQuality: q > 0, noQuality: q === 0, pipS: Math.max(4, Math.round(9 * k)), pipGap: Math.max(3, Math.round(7 * k)), pipRow,
      pips: [1, 2, 3, 4, 5].map((i) => ({ bg: i <= q ? '#E9B44C' : 'rgba(255,255,255,0.18)' })),
      hasCount: max > 0, showMeta: max === 0 && !!p.meta, countLabel: t.count, left, max, counts, cGap: Math.max(2, Math.round(4 * k))
    };
  }
}
</script>
</body>
</html>
