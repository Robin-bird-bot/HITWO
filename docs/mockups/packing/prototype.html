:root { --pix: 'EditUndo', monospace; --sans: system-ui, -apple-system, 'Segoe UI', sans-serif; --ink: #2A2420; --paper: #F2EBD8; --red: #C8423A; --gold: #E8C55A; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #140d08; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; width: 1600px; height: 1000px; transform-origin: 0 0; font-family: var(--sans); color: #f1eadb; overflow: hidden; }
#shake { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(255,190,110,.10), transparent 55%),
    radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.6) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(90deg, rgba(255,220,170,.025) 0 1px, transparent 1px 9px),
    linear-gradient(#3b2416, #24150c); }
.wood { background:
    radial-gradient(circle, #f0c76a 0 2.5px, #6e4a1c 3px, transparent 4px) 9px 9px / 12px 12px no-repeat,
    radial-gradient(circle, #f0c76a 0 2.5px, #6e4a1c 3px, transparent 4px) calc(100% - 9px) 9px / 12px 12px no-repeat,
    radial-gradient(circle, #f0c76a 0 2.5px, #6e4a1c 3px, transparent 4px) 9px calc(100% - 9px) / 12px 12px no-repeat,
    radial-gradient(circle, #f0c76a 0 2.5px, #6e4a1c 3px, transparent 4px) calc(100% - 9px) calc(100% - 9px) / 12px 12px no-repeat,
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 140px),
    repeating-linear-gradient(0deg, rgba(255,235,200,.035) 0 1px, transparent 1px 6px),
    linear-gradient(#7a4c2a, #5e3820); }
.brass { background: linear-gradient(#f4cf72, #d9a441); color: #3a2410; }

/* the left and right columns */
#title { position: absolute; left: 40px; top: 30px; font-family: var(--pix); font-size: 30px; letter-spacing: 3px; color: #fff3d2; text-shadow: 0 3px 0 #120a05; }
#steps { position: absolute; left: 40px; top: 78px; display: flex; gap: 8px; }
#steps span { font-family: var(--pix); font-size: 11px; letter-spacing: 1px; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.06); color: #a8957a; border: 1px solid rgba(255,255,255,.1); }
#steps span.on { background: var(--gold); color: #3a2410; border-color: #fff0b8; }
#steps span.done { color: #d9c7a6; }
#help { position: absolute; left: 40px; top: 122px; width: 360px; font-size: 15px; line-height: 1.5; color: #e0cfae; }
#help b { color: #fff0cf; }
.plaque { position: absolute; border-radius: 10px; padding: 16px 18px; box-shadow: 0 6px 0 #1c110a, 0 12px 22px rgba(0,0,0,.45); }
.plaque h3 { margin: 0 0 10px; font-family: var(--pix); font-weight: normal; font-size: 13px; letter-spacing: 2px; color: var(--gold); text-shadow: 0 -1px 0 rgba(0,0,0,.6); }
#odds { position: relative; width: 360px; }
.orow { display: grid; grid-template-columns: 54px 1fr 46px; align-items: center; gap: 10px; margin: 7px 0; }
.orow .chip { height: 34px; border-radius: 8px; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.orow .chip img { width: 30px; height: 30px; }
.orow .nm { font-family: var(--pix); font-size: 12px; letter-spacing: 1px; color: #f3e2bd; }
.orow .pc { font-family: var(--pix); font-size: 15px; color: #fff3d2; text-align: right; }
.obar { height: 6px; border-radius: 3px; background: rgba(0,0,0,.3); margin-top: 6px; overflow: hidden; }
.obar i { display: block; height: 100%; background: var(--gold); }
#oddsnote { font-size: 12.5px; color: #d8c49c; margin-top: 10px; line-height: 1.4; }
#pay { position: relative; width: 364px; }
.prow { display: grid; grid-template-columns: 128px 1fr; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px dashed rgba(255,230,180,.22); }
.prow:first-of-type { border-top: 0; }
.prow .pat { display: flex; gap: 3px; }
.prow .pat i { width: 22px; height: 22px; border-radius: 5px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
.prow .pat i.x { background: #2a1a10 !important; box-shadow: inset 0 0 0 2px #5a3a22; }
.prow .pat b { font-family: var(--pix); font-weight: normal; font-size: 12px; color: #3a2410; background: #f3dcae; border-radius: 5px; padding: 4px 5px; }
.prow .win { font-family: var(--pix); font-size: 11.5px; letter-spacing: .6px; line-height: 1.45; color: #fff0cf; }
.prow .win em { font-style: normal; color: var(--gold); }
.prow.hit { animation: hit 1.2s ease; border-radius: 6px; }
@keyframes hit { 0%, 60% { background: rgba(232,197,90,.35); } }
#rules { font-size: 12.5px; color: #d8c49c; margin-top: 8px; line-height: 1.45; }

/* pull-out drawers (Wyatt: hidden unless the player wants them) */
.drawer { position: absolute; z-index: 14; transition: transform .5s cubic-bezier(.3,1.35,.5,1); }
.drawer.l { left: 40px; top: 352px; transform: translateX(-400px); }
.drawer.r { left: 1196px; top: 590px; transform: translateX(404px); }
.drawer.open { transform: none; }
.handle { position: absolute; top: 26px; width: 38px; height: 150px; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0;
  font-family: var(--pix); font-size: 12px; letter-spacing: 3px; color: #fff0cf; writing-mode: vertical-rl; box-shadow: 0 6px 0 #1c110a, 0 10px 16px rgba(0,0,0,.4); }
.drawer.l .handle { right: -38px; border-radius: 0 10px 10px 0; }
.drawer.r .handle { left: -38px; border-radius: 10px 0 0 10px; transform: rotate(180deg); }
.handle i { font-style: normal; color: var(--gold); margin-top: 6px; }
.handle.ping { animation: ping .5s ease-in-out 5 alternate; }
@keyframes ping { to { box-shadow: 0 0 0 3px var(--gold), 0 0 24px 6px rgba(255,214,110,.8); color: #fff; } }

/* the machine */
#bracket { position: absolute; left: 742px; top: 104px; width: 116px; height: 104px; }
#bracket::before, #bracket::after { content: ''; position: absolute; top: 0; width: 14px; height: 116px; border-radius: 6px; background: linear-gradient(90deg, #b98a34, #f4cf72, #b98a34); box-shadow: 0 3px 0 #3a2410; }
#bracket::before { left: 18px; transform: rotate(16deg); transform-origin: 50% 0; }
#bracket::after { right: 18px; transform: rotate(-16deg); transform-origin: 50% 0; }
#wheelwrap { position: absolute; left: 680px; top: -16px; width: 240px; height: 240px; filter: drop-shadow(0 8px 0 #160d07) drop-shadow(0 14px 18px rgba(0,0,0,.5)); }
#wheel { transform-box: view-box; transform-origin: 120px 120px; }
#sq .legs-b, #sq .legs-a, #sq .eye-shut, #sq .tongue, #sq .sweat { display: none; }
#sq.run .legs-sit { display: none; } #sq.run .legs-a { display: inline; } #sq.run.f2 .legs-a { display: none; } #sq.run.f2 .legs-b { display: inline; }
#sq.tired .tongue, #sq.tired .sweat { display: inline; } #sq.tired .eye-open, #sq.blink .eye-open { display: none; } #sq.tired .eye-shut, #sq.blink .eye-shut { display: inline; }
#sq .sq-head { transform-box: fill-box; transform-origin: 30% 80%; transition: transform .25s ease; }
#sq.peek .sq-head { transform: rotate(12deg) translate(4px, 2px) scale(1.08); }
#sq.run .sq-body { animation: bob .14s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-2.5px); } }
#sq .sq-body { transform-box: fill-box; transform-origin: 50% 60%; }
#sq .sq-tail { transform-box: fill-box; transform-origin: 90% 95%; animation: flick 3.2s ease-in-out infinite; }
#sq.run .sq-tail { animation: flick .3s ease-in-out infinite; }
@keyframes flick { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(-10deg); } }

#cab { position: absolute; left: 440px; top: 222px; width: 720px; height: 530px; border-radius: 46px 46px 14px 14px; box-shadow: 0 12px 0 #160d07, 0 26px 40px rgba(0,0,0,.55), inset 0 0 0 4px #3e2414; }
#cab::before { content: ''; position: absolute; left: 18px; right: 18px; bottom: -6px; height: 22px; border-radius: 0 0 10px 10px; background: linear-gradient(#4a2c17, #2a170c); z-index: -1; }
#sign { position: absolute; left: 34px; top: 18px; width: 652px; height: 82px; border-radius: 30px 30px 8px 8px; display: grid; place-items: center; box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 #2a170c; }
#sign .txt { display: block; line-height: 1; margin-top: 4px; font-family: var(--pix); font-size: 31px; letter-spacing: 5px; color: var(--gold); text-shadow: 0 -2px 0 rgba(0,0,0,.6), 0 1px 0 rgba(255,240,200,.3), 0 0 14px rgba(232,197,90,.35); }
#sign .sub { display: block; text-align: center; margin-top: 3px; font-family: var(--pix); font-size: 10px; letter-spacing: 3px; color: #e6cf98; }
.bulb { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #6a4a22; box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
.bulb.on { background: #ffe9a0; box-shadow: 0 0 8px 3px rgba(255,214,110,.75), inset 0 -2px 0 rgba(200,140,30,.5); }
#window { position: absolute; left: 30px; top: 116px; width: 660px; height: 278px; border-radius: 14px; padding: 13px 15px;
  background: linear-gradient(#f4cf72, #b98a34); box-shadow: inset 0 3px 0 #fff1c0, inset 0 -3px 0 #7a5418, 0 5px 0 #2a170c; }
#reels { position: relative; width: 630px; height: 252px; border-radius: 8px; background: #160d07; box-shadow: inset 0 0 0 3px #3a2410; }
.reel { position: absolute; top: 0; height: 252px; overflow: hidden; border-radius: 6px; cursor: grab; touch-action: none;
  background:
    repeating-linear-gradient(0deg, rgba(120,70,30,.18) 0 2px, transparent 2px 11px),
    linear-gradient(90deg, #d9b07a, #f0d3a2 50%, #d9b07a); }
.reel .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }

<div id="stage"><div id="shake">
  <div id="title">PACK FOR THE TRAIL</div>

    <g class="sq-body">

        <path d="M36 58 L44 72 L52 70 L44 56Z" fill="#a95a2c"/><path d="M76 58 L68 72 L76 73 L84 60Z" fill="#a95a2c"/>

  const pts = []; for (let k = 0; k < 22; k++) pts.push([14 + k * (W - 28) / 21, 6]); for (let k = 1; k < 3; k++) pts.push([W - 8, 6 + k * (H - 12) / 3]);
  for (let k = 21; k >= 0; k--) pts.push([14 + k * (W - 28) / 21, H - 12]); for (let k = 2; k >= 1; k--) pts.push([2, 6 + k * (H - 12) / 3]);
  pts.forEach(([x, y], i) => h += `<i class="bulb" style="left:${x - 5}px;top:${y - 2}px" data-i="${i}"></i>`);
  s.insertAdjacentHTML('beforeend', h);
  let t = 0; setInterval(() => { t++; const fast = !!document.querySelector('.bulb[data-fast]'); document.querySelectorAll('.bulb').forEach((b, i) => b.classList.toggle('on', fast ? (i + t) % 2 === 0 : (i + Math.floor(t / 2)) % 4 === 0)); }, 110);
}

// ── testing: force the next spin ───────────────────────────────────────────
const RIGS = { items: [['r3', '3 IN A ROW'], ['r4', '4 IN A ROW'], ['r5', 'JACKPOT'], ['t2', 'A TIER II']], res: [['b1', '×1 ×1 ×1'], ['b2', '×2 ×2 ×2'], ['b3', '×3 ×3 ×3'], ['b5', 'A ×5']] };
function renderRig() {
  const row = $('rigrow'); row.innerHTML = '<b>NEXT SPIN</b>' + RIGS[S.phase === 'items' ? 'items' : 'res'].map(([k, l]) => `<button data-rig="${k}" class="${S.rig === k ? 'on' : ''}">${l}</button>`).join('');
  row.querySelectorAll('button').forEach(b => b.onclick = () => { S.rig = S.rig === b.dataset.rig ? null : b.dataset.rig; renderRig(); });
}
function applyRig(res) {
  const k = S.rig; if (!k) return; const lit = S.reels.filter(r => r.lit).map(r => r.i);
  if (k === 't2') { const i = rnd(lit); res[i] = newItem(res[i].type, 2); return; }
  if (k === 'b5') { const i = rnd(lit); res[i] = newBundle(5); return; }
  if (k[0] === 'b') { if (lit.length === 3) lit.forEach(i => res[i] = newBundle(+k[1])); return; }
  const n = +k[1]; // find n reels next to each other, all lit
  for (let s = 0; s + n <= res.length; s++) {
    const idx = Array.from({ length: n }, (_, j) => s + j); if (!idx.every(i => S.reels[i].lit)) continue;
    const t = rnd(n === 5 ? ['tool', 'food', 'clothes'] : TYPES.slice(0, 3));
    idx.forEach(i => res[i] = newItem(t, 1));
    [s - 1, s + n].forEach(i => { if (res[i] && S.reels[i].lit) res[i] = newItem(rnd(TYPES.filter(x => x !== t)), 1); });
    return;
  }
}
document.querySelectorAll('#test [data-n]').forEach(b => b.onclick = () => { if (!S.busy) reset(+b.dataset.n); });
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? 'SOUND OFF' : 'SOUND ON'; };

bulbs(); reset(3); renderRig();
</script>
